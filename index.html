<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Portal Pracownika - Grafik i Godziny</title>
  
  <!-- Ustawienia PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Grafik">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #f3f4f6; }
    .custom-scroll::-webkit-scrollbar { height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- ==================== EKRAN LOGOWANIA ==================== -->
  <main id="login-view" class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-7 border border-slate-100">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-emerald-50 text-emerald-700 mb-3 font-bold text-xl">
          ⏱️
        </div>
        <h1 class="text-2xl font-bold text-slate-800">Panel Pracownika</h1>
        <p class="text-sm text-slate-500 mt-1">Zaloguj się, aby sprawdzić grafik i godziny</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1" for="username">Login</label>
          <input type="text" id="username" required autocomplete="username"
                 class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none transition text-sm"
                 placeholder="Wpisz login" />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1" for="password">Hasło</label>
          <input type="password" id="password" required autocomplete="current-password"
                 class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-600 focus:outline-none transition text-sm"
                 placeholder="••••••••" />
        </div>

        <div id="login-error" class="hidden text-sm text-rose-600 bg-rose-50 border border-rose-200 rounded-lg p-2.5 text-center font-medium"></div>

        <button type="submit" id="btn-login"
                class="w-full py-3 px-4 bg-emerald-700 hover:bg-emerald-800 text-white font-semibold rounded-lg shadow-md transition duration-200 flex justify-center items-center">
          <span>Zaloguj się</span>
        </button>

        <!-- ZAWSZE WIDOCZNY PRZYCISK DODANIA DO EKRANU GŁÓWNEGO -->
        <button type="button" class="btn-install-trigger w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg text-xs transition duration-200 flex items-center justify-center gap-2 border border-slate-300">
          <span>📲 Dodaj ikonę do ekranu telefonu</span>
        </button>
      </form>
    </div>
  </main>

  <!-- ==================== WIDOK PO ZALOGOWANIU ==================== -->
  <div id="dashboard-view" class="hidden flex-grow flex flex-col">
    <!-- Pasek górny -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
      <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
        <div>
          <h2 class="text-base sm:text-lg font-bold text-slate-800" id="user-display-name">Pracownik</h2>
          <span class="text-xs text-slate-500">Miesięczny wykaz czasu pracy</span>
        </div>
        <div class="flex items-center gap-2">
          <!-- Przycisk w nagłówku -->
          <button type="button" class="btn-install-trigger text-xs font-semibold text-emerald-700 hover:text-emerald-900 border border-emerald-300 bg-emerald-50 px-2.5 py-1.5 rounded-lg transition flex items-center gap-1 shadow-sm">
            <span>📲 Ekran główny</span>
          </button>
          <button id="btn-logout" class="text-xs sm:text-sm font-semibold text-rose-600 hover:text-rose-800 border border-rose-200 hover:border-rose-400 bg-rose-50 px-3 py-1.5 rounded-lg transition">
            Wyloguj
          </button>
        </div>
      </div>
    </header>

    <!-- Główna zawartość -->
    <main class="max-w-5xl mx-auto w-full p-4 sm:p-6 space-y-5">
      <!-- Filtry wyboru daty -->
      <section class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 flex flex-wrap gap-4 items-center justify-between">
        <div class="flex flex-wrap items-center gap-3 w-full sm:w-auto">
          <div>
            <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Miesiąc</label>
            <select id="select-month" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-medium focus:ring-2 focus:ring-emerald-600 outline-none"></select>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Rok</label>
            <select id="select-year" class="bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-sm font-medium focus:ring-2 focus:ring-emerald-600 outline-none"></select>
          </div>
        </div>

        <!-- Podsumowania godzinowe -->
        <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
          <div class="bg-emerald-50 border border-emerald-100 px-3.5 py-2 rounded-lg text-right flex-1 sm:flex-initial">
            <div class="text-[10px] font-bold uppercase text-emerald-800">Czas pracy</div>
            <div class="text-base font-extrabold text-emerald-700" id="summary-work">0 godz.</div>
          </div>
          <div class="bg-rose-50 border border-rose-100 px-3.5 py-2 rounded-lg text-right flex-1 sm:flex-initial">
            <div class="text-[10px] font-bold uppercase text-rose-800">Nieobecności</div>
            <div class="text-base font-extrabold text-rose-600" id="summary-absence">0 godz.</div>
          </div>
        </div>
      </section>

      <!-- Stan ładowania -->
      <div id="loading-spinner" class="hidden text-center py-12">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-600 border-t-transparent"></div>
        <p class="text-sm font-medium text-slate-500 mt-2">Pobieranie danych z bazy...</p>
      </div>

      <!-- Karta tabeli -->
      <section id="table-card" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto custom-scroll">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="bg-slate-800 text-white text-xs uppercase tracking-wider">
                <th class="py-3 px-3.5 whitespace-nowrap">Data</th>
                <th class="py-3 px-3.5 whitespace-nowrap">Zmiana / Godziny</th>
                <th class="py-3 px-3.5 text-center whitespace-nowrap">Suma</th>
                <th class="py-3 px-3.5 whitespace-nowrap">Wystawił raport</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-slate-100">
              <!-- Wiersze generowane dynamicznie -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- ==================== MODAL / INSTRUKCJA DODAWANIA DO EKRANU GŁÓWNEGO ==================== -->
  <div id="install-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4 text-center">
      <div class="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
        📲
      </div>
      <h3 class="text-lg font-bold text-slate-800">Dodaj do ekranu telefonu</h3>
      <div id="install-instructions" class="text-xs text-slate-600 text-left space-y-2 bg-slate-50 p-3.5 rounded-xl border border-slate-200">
        <!-- Wypełniane przez JavaScript w zależności od systemu -->
      </div>
      <button id="btn-close-modal" type="button" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-lg text-sm transition">
        Rozumiem
      </button>
    </div>
  </div>

  <footer class="text-center py-4 text-xs text-slate-400">
    &copy; Panel ewidencji czasu pracy
  </footer>

  <!-- ==================== SKRYPT LOGIKI ==================== -->
  <script>
    const SUPABASE_URL = "https://puqqxdqwhhhlrihnoftn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_8pqNzzdMVwdk9Plz48an2Q_GPEBar14";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const MONTHS = [
      "Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec",
      "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"
    ];

    let currentUser = null;

    // --- Obsługa instalacji na ekranie głównym ---
    let deferredPrompt = null;
    const installModal = document.getElementById("install-modal");
    const installInstructions = document.getElementById("install-instructions");
    const isIos = () => /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    document.querySelectorAll(".btn-install-trigger").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          deferredPrompt = null;
          if (outcome === 'accepted') return;
        }

        // Jeśli brak natywnego promptu, pokazujemy jasną instrukcję dopasowaną do urządzenia
        if (isIos()) {
          installInstructions.innerHTML = `
            <p><strong>Dla iPhone / iPad (Safari):</strong></p>
            <ol class="list-decimal list-inside space-y-1">
              <li>Kliknij ikonę <strong>Udostępnij</strong> (kwadrat ze strzałką w górę na dolnym pasku).</li>
              <li>Przewiń w dół i wybierz <strong>„Do ekranu początkowego”</strong>.</li>
              <li>Kliknij <strong>„Dodaj”</strong> w prawym górnym rogu.</li>
            </ol>
          `;
        } else {
          installInstructions.innerHTML = `
            <p><strong>Dla telefonu z systemem Android:</strong></p>
            <ol class="list-decimal list-inside space-y-1">
              <li>Kliknij ikonę <strong>trzech pionowych kropek (⋮)</strong> w prawym górnym rogu przeglądarki.</li>
              <li>Wybierz opcję <strong>„Dodaj do ekranu głównego”</strong> lub <strong>„Zainstaluj aplikację”</strong>.</li>
              <li>Potwierdź klikając <strong>„Dodaj”</strong>.</li>
            </ol>
          `;
        }
        installModal.classList.remove("hidden");
      });
    });

    document.getElementById("btn-close-modal").addEventListener("click", () => {
      installModal.classList.add("hidden");
    });

    function getShiftPriority(shiftText) {
      if (!shiftText) return 4;
      const t = String(shiftText).toUpperCase().trim();
      if (t.includes("I") && !t.includes("II") && !t.includes("III")) return 1;
      if (t.includes("1")) return 1;
      if (t.includes("II") && !t.includes("III")) return 2;
      if (t.includes("2")) return 2;
      if (t.includes("III") || t.includes("3")) return 3;
      return 4;
    }

    const selectMonth = document.getElementById("select-month");
    const selectYear = document.getElementById("select-year");
    const now = new Date();

    MONTHS.forEach((m, idx) => {
      const opt = document.createElement("option");
      opt.value = idx + 1;
      opt.textContent = m;
      if (idx === now.getMonth()) opt.selected = true;
      selectMonth.appendChild(opt);
    });

    for (let y = 2024; y <= 2030; y++) {
      const opt = document.createElement("option");
      opt.value = y;
      opt.textContent = y;
      if (y === now.getFullYear()) opt.selected = true;
      selectYear.appendChild(opt);
    }

    const loginForm = document.getElementById("login-form");
    const loginError = document.getElementById("login-error");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.classList.add("hidden");
      const btn = document.getElementById("btn-login");
      btn.disabled = true;
      btn.classList.add("opacity-60");

      const loginInput = document.getElementById("username").value.trim();
      const passwordInput = document.getElementById("password").value.trim();

      try {
        const { data, error } = await client
          .from("web_user")
          .select("name, last_name, login, password")
          .eq("login", loginInput)
          .eq("password", passwordInput)
          .single();

        if (error || !data) {
          throw new Error("Nieprawidłowy login lub hasło.");
        }

        currentUser = {
          firstName: (data.name || "").trim(),
          lastName: (data.last_name || "").trim()
        };

        sessionStorage.setItem("user_session", JSON.stringify(currentUser));
        showDashboard();

      } catch (err) {
        loginError.textContent = err.message || "Wystąpił błąd logowania.";
        loginError.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.classList.remove("opacity-60");
      }
    });

    function showDashboard() {
      document.getElementById("login-view").classList.add("hidden");
      document.getElementById("dashboard-view").classList.remove("hidden");
      document.getElementById("user-display-name").textContent = `${currentUser.firstName} ${currentUser.lastName}`;
      loadMonthlyData();
    }

    document.getElementById("btn-logout").addEventListener("click", () => {
      sessionStorage.removeItem("user_session");
      currentUser = null;
      document.getElementById("dashboard-view").classList.add("hidden");
      document.getElementById("login-view").classList.remove("hidden");
      document.getElementById("login-form").reset();
    });

    selectMonth.addEventListener("change", loadMonthlyData);
    selectYear.addEventListener("change", loadMonthlyData);

    async function loadMonthlyData() {
      if (!currentUser) return;

      const year = parseInt(selectYear.value);
      const monthIdx = parseInt(selectMonth.value);
      const suffix = `.${String(monthIdx).padStart(2, '0')}.${year}`;

      const spinner = document.getElementById("loading-spinner");
      const tableCard = document.getElementById("table-card");
      spinner.classList.remove("hidden");
      tableCard.classList.add("opacity-40");

      try {
        const { data: workRows } = await client
          .from("WorkReports")
          .select("data_raportu, zmiana, godzina_od, godzina_do, suma_godzin, dodal")
          .ilike("imie", currentUser.firstName)
          .ilike("nazwisko", currentUser.lastName);

        // Pobieramy wyłącznie potrzebne kolumny – bez kolumny powod
        const { data: absenceRows } = await client
          .from("AbsenceReports")
          .select("data_raportu, zmiana, dodal, godzina_od, godzina_do, suma_godzin")
          .ilike("imie", currentUser.firstName)
          .ilike("nazwisko", currentUser.lastName);

        const monthlyRecords = {};
        const absenceRecords = {};

        (workRows || []).forEach(row => {
          const d = (row.data_raportu || "").trim();
          if (d.endsWith(suffix)) {
            if (!monthlyRecords[d]) monthlyRecords[d] = [];
            monthlyRecords[d].push(row);
          }
        });

        (absenceRows || []).forEach(row => {
          const d = (row.data_raportu || "").trim();
          if (d.endsWith(suffix)) {
            if (!absenceRecords[d]) absenceRecords[d] = [];
            absenceRecords[d].push(row);
          }
        });

        renderTable(year, monthIdx, monthlyRecords, absenceRecords);
      } catch (e) {
        console.error("Błąd podczas pobierania danych:", e);
      } finally {
        spinner.classList.add("hidden");
        tableCard.classList.remove("opacity-40");
      }
    }

    function renderTable(year, monthIdx, monthlyRecords, absenceRecords) {
      const tbody = document.getElementById("table-body");
      tbody.innerHTML = "";

      const daysInMonth = new Date(year, monthIdx, 0).getDate();
      let totalWorkHours = 0.0;
      let totalAbsenceHours = 0.0;

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${String(day).padStart(2, '0')}.${String(monthIdx).padStart(2, '0')}.${year}`;
        const dayEntries = [];

        if (monthlyRecords[dateStr]) {
          monthlyRecords[dateStr].forEach(entry => {
            dayEntries.push({
              type: 'work',
              zmiana: entry.zmiana || "-",
              od: entry.godzina_od || "-",
              do: entry.godzina_do || "-",
              suma: entry.suma_godzin,
              dodal: entry.dodal || "-"
            });
          });
        }

        if (absenceRecords[dateStr]) {
          absenceRecords[dateStr].forEach(entry => {
            dayEntries.push({
              type: 'absence',
              zmiana: entry.zmiana || "-",
              od: entry.godzina_od || "-",
              do: entry.godzina_do || "-",
              suma: entry.suma_godzin !== null && entry.suma_godzin !== undefined ? entry.suma_godzin : 8.0,
              dodal: entry.dodal || "-"
            });
          });
        }

        dayEntries.sort((a, b) => getShiftPriority(a.zmiana) - getShiftPriority(b.zmiana));

        if (dayEntries.length > 0) {
          dayEntries.forEach((item, idx) => {
            const tr = document.createElement("tr");
            const isFirst = (idx === 0);
            const dateCellHtml = isFirst ? `<span class="font-bold">${dateStr}</span>` : "";

            if (item.type === 'work') {
              const hVal = parseFloat(String(item.suma).replace(',', '.')) || 0.0;
              totalWorkHours += hVal;
              const hText = Number.isInteger(hVal) ? `${hVal} godz.` : `${hVal.toFixed(1)} godz.`;

              tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
              tr.innerHTML = `
                <td class="py-2.5 px-3.5 text-slate-800 whitespace-nowrap">${dateCellHtml}</td>
                <td class="py-2.5 px-3.5 font-semibold text-blue-700 whitespace-nowrap">${item.zmiana} (${item.od} - ${item.do})</td>
                <td class="py-2.5 px-3.5 text-center font-bold text-slate-700 whitespace-nowrap">${hText}</td>
                <td class="py-2.5 px-3.5 text-slate-600 text-xs sm:text-sm">${item.dodal}</td>
              `;
            } else {
              // TYLKO ZMIANA I IMIE/NAZWISKO DODAJĄCEGO (brak słowa "NIEOBECNOŚĆ", brak powodu)
              const absVal = parseFloat(String(item.suma).replace(',', '.')) || 0.0;
              totalAbsenceHours += absVal;
              const absText = Number.isInteger(absVal) ? `${absVal} godz.` : `${absVal.toFixed(1)} godz.`;
              const shiftDetails = (item.od !== "-" && item.do !== "-") 
                ? `${item.zmiana} (${item.od} - ${item.do})` 
                : item.zmiana;

              tr.className = "bg-rose-50/70 hover:bg-rose-100/50 transition border-b border-rose-100 text-rose-900";
              tr.innerHTML = `
                <td class="py-2.5 px-3.5 font-medium whitespace-nowrap">${dateCellHtml}</td>
                <td class="py-2.5 px-3.5 font-semibold whitespace-nowrap">${shiftDetails}</td>
                <td class="py-2.5 px-3.5 text-center font-bold whitespace-nowrap">${absText}</td>
                <td class="py-2.5 px-3.5 text-xs sm:text-sm font-medium text-slate-700">${item.dodal}</td>
              `;
            }
            tbody.appendChild(tr);
          });
        } else {
          const tr = document.createElement("tr");
          tr.className = "hover:bg-slate-50 transition border-b border-slate-100 text-slate-400";
          tr.innerHTML = `
            <td class="py-2.5 px-3.5 whitespace-nowrap">${dateStr}</td>
            <td class="py-2.5 px-3.5 italic text-xs">Dzień wolny / Brak wpisu</td>
            <td class="py-2.5 px-3.5 text-center text-xs">0 godz.</td>
            <td class="py-2.5 px-3.5 text-xs">-</td>
          `;
          tbody.appendChild(tr);
        }
      }

      const workStr = Number.isInteger(totalWorkHours) ? totalWorkHours : totalWorkHours.toFixed(1);
      const absStr = Number.isInteger(totalAbsenceHours) ? totalAbsenceHours : totalAbsenceHours.toFixed(1);
      document.getElementById("summary-work").textContent = `${workStr} godz.`;
      document.getElementById("summary-absence").textContent = `${absStr} godz.`;
    }

    window.addEventListener("DOMContentLoaded", () => {
      const savedSession = sessionStorage.getItem("user_session");
      if (savedSession) {
        try {
          currentUser = JSON.parse(savedSession);
          showDashboard();
        } catch (e) {
          sessionStorage.removeItem("user_session");
        }
      }
    });
  </script>
</body>
</html>
